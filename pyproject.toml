[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finrag-studio"
version = "0.1.0"
description = "Local financial PDF provenance and evaluation-data validation"
requires-python = ">=3.12,<3.14"
license = {file = "LICENSE"}
dependencies = ["pydantic==2.13.5", "pypdf==6.10.0"]

[project.optional-dependencies]
ui = ["streamlit==1.54.0"]
dev = ["pytest==8.3.5", "reportlab==4.4.9", "ruff==0.11.13"]
retrieval = [
  "torch==2.7.1", "transformers==4.51.3", "tokenizers==0.21.4",
  "huggingface-hub==0.30.2", "safetensors==0.5.3", "numpy==1.26.4",
  "faiss-cpu==1.10.0", "sentencepiece==0.2.0",
]

[project.scripts]
finrag = "finrag.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
